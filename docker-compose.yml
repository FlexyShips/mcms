services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mcdms-postgres
    environment:
      POSTGRES_USER: mcdms
      POSTGRES_PASSWORD: mcdms
      POSTGRES_DB: mcdms
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcdms -d mcdms"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mcdms-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
